<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Children's Character Quiz</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 700px; margin: auto; }
    h1, h2 { color: #444; }
    .question { margin-bottom: 1.5rem; }
    .hidden { display: none; }
    .recommendations { margin-top: 2rem; border-top: 1px solid #ccc; padding-top: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1 id="quizTitle">Children's Character Quiz</h1>
  <form id="quizForm">
    <div id="quizContainer"></div>
    <button type="submit">Submit Answers</button>
  </form>

  <div id="result" class="hidden">
    <h2>Recommended Books</h2>
    <p id="scoreDisplay"></p>
    <ul id="recommendationsList"></ul>
  </div>

  <script>
    const questions = [
      {
        text: "What should you do if someone drops their things in front of others?",
        options: ["Wait and see what others do", "Step in and offer help kindly", "Tell them to be more careful", "Walk away quietly"],
        answer: 1,
        weight: 2,
        books: ["Lumi the Light Learns About Friendship"]
      },
      {
        text: "You feel nervous before speaking in front of a group. What thought helps most?",
        options: ["They’ll laugh anyway", "At least I tried my best", "Someone else should do this", "Avoid eye contact and rush"],
        answer: 1,
        weight: 2,
        books: ["Lumi the Light Learns to Hope", "Lumi the Light Learns to Shine"]
      },
      {
        text: "What helps more in the long run?",
        options: ["Natural talent", "Looking smart", "Learning from failure", "Avoiding challenges"],
        answer: 2,
        weight: 3,
        books: ["Sometimes You Win, Sometimes You Learn"]
      },
      {
        text: "Why do people cooperate without one person in charge?",
        options: ["To avoid mistakes", "Because of teamwork and trade", "For rewards", "To follow orders"],
        answer: 1,
        weight: 1,
        books: ["Miraculous Pencil"]
      },
      {
        text: "What makes charity meaningful?",
        options: ["Being forced to give", "Expecting a reward", "Giving freely with purpose", "Bragging about it"],
        answer: 2,
        weight: 2,
        books: ["The Tuttle Twins Learn About the Law"]
      }
    ];

    const form = document.getElementById('quizForm');
    const container = document.getElementById('quizContainer');
    const resultDiv = document.getElementById('result');
    const recommendationsList = document.getElementById('recommendationsList');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const quizTitle = document.getElementById('quizTitle');

    questions.forEach((q, i) => {
      const div = document.createElement('div');
      div.className = 'question';
      const qTitle = document.createElement('p');
      qTitle.innerHTML = `<strong>Q${i + 1}:</strong> ${q.text}`;
      div.appendChild(qTitle);
      q.options.forEach((opt, idx) => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="radio" name="q${i}" value="${idx}" required> ${opt}`;
        div.appendChild(label);
        div.appendChild(document.createElement('br'));
      });
      container.appendChild(div);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const data = new FormData(form);
      const recommended = new Set();
      let score = 0;
      let totalWeight = 0;

      questions.forEach((q, i) => {
        const userAnswer = parseInt(data.get(`q${i}`));
        totalWeight += q.weight;
        if (userAnswer === q.answer) {
          score += q.weight;
        } else {
          q.books.forEach(book => recommended.add(book));
        }
      });

      container.classList.add('hidden');
      form.querySelector('button').classList.add('hidden');
      resultDiv.classList.remove('hidden');
      recommendationsList.innerHTML = "";
      quizTitle.textContent = `Children's Character Quiz – Score: ${score}/${totalWeight}`;

      if (recommended.size === 0) {
        recommendationsList.innerHTML = "<li>You got everything right! No additional reading needed.</li>";
      } else {
        recommended.forEach(book => {
          const li = document.createElement('li');
          li.textContent = book;
          recommendationsList.appendChild(li);
        });
      }
    });
  </script>
</body>
</html>
