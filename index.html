<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Children's Character Quiz</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 700px; margin: auto; }
    h1, h2 { color: #444; }
    .question { margin-bottom: 1.5rem; }
    .hidden { display: none; }
    .recommendations { margin-top: 2rem; border-top: 1px solid #ccc; padding-top: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1 id="quizTitle">Children's Character Quiz</h1>
  <form id="quizForm">
    <div id="quizContainer"></div>
    <button type="submit">Submit Answers</button>
  </form>

  <div id="result" class="hidden">
    <h2>Recommended Books</h2>
    <p id="scoreDisplay"></p>
    <ul id="recommendationsList"></ul>
  </div>

  <script>
    const questions = [
      {
        text: "Which of the following behaviors best supports forming long-lasting, genuine friendships?",
        options: ["Offering help only when convenient", "Staying true to yourself while showing empathy to others", "Trying to fit in by mimicking others", "Waiting for others to initiate conversations"],
        answer: 1,
        book: "Lumi the Light Learns About Friendship"
      },
      {
        text: "In a challenging situation, how can hope be most effectively maintained?",
        options: ["By pretending everything is fine", "By reflecting on small positive outcomes and encouraging others", "By expecting others to fix the issue", "By ignoring the problem and staying busy"],
        answer: 1,
        book: "Lumi the Light Learns to Hope"
      },
      {
        text: "What approach most consistently allows someone to express their unique strengths?",
        options: ["Outperforming everyone around you", "Hiding flaws to appear perfect", "Being brave, kind, and consistently authentic", "Focusing on competing with peers"],
        answer: 2,
        book: "Lumi the Light Learns to Shine"
      },
      {
        text: "What does the process of making a pencil reveal about how society works?",
        options: ["It proves central planning leads to success", "It shows that complex products require shared efforts and voluntary cooperation", "It highlights that experts manage most of the work", "It demonstrates that government coordination ensures fairness"],
        answer: 1,
        book: "Miraculous Pencil"
      },
      {
        text: "What is a productive response to personal failure?",
        options: ["Blaming circumstances", "Giving up on similar tasks", "Analyzing what went wrong and applying lessons learned", "Pretending the failure didn’t happen"],
        answer: 2,
        book: "Sometimes You Win, Sometimes You Learn"
      },
      {
        text: "What is the primary justification for having laws in a free society?",
        options: ["To ensure conformity", "To maintain control over property and behavior", "To protect individual rights such as life, liberty, and property", "To guarantee equal distribution of resources"],
        answer: 2,
        book: "The Tuttle Twins Learn About the Law"
      },
      {
        text: "How should one best navigate unexpected life transitions?",
        options: ["Stick strictly to routine and avoid change", "Remain flexible and open to adapting with courage", "Wait for others to take the lead", "Resist changes unless they are clearly beneficial"],
        answer: 1,
        book: "Who Moved My Cheese for Kids"
      },
      {
        text: "Why might teachability be more beneficial long-term than raw talent?",
        options: ["Because it leads to fewer mistakes", "Because it encourages resilience, reflection, and growth", "Because it’s easier to manage", "Because smart people are always teachable"],
        answer: 1,
        book: "Sometimes You Win, Sometimes You Learn"
      },
      {
        text: "Why is forgiveness often essential for sustaining meaningful relationships?",
        options: ["It helps avoid future arguments", "It prevents others from taking advantage", "It promotes emotional healing and deeper connection", "It gives you the moral upper hand"],
        answer: 2,
        book: "Lumi the Light Learns About Friendship"
      },
      {
        text: "What makes voluntary giving more valuable than forced contributions?",
        options: ["It guarantees fairness", "It proves loyalty", "It reflects genuine intention and respect for choice", "It reduces misunderstandings"],
        answer: 2,
        book: "The Tuttle Twins Learn About the Law"
      }
    ];

    const form = document.getElementById('quizForm');
    const container = document.getElementById('quizContainer');
    const resultDiv = document.getElementById('result');
    const recommendationsList = document.getElementById('recommendationsList');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const quizTitle = document.getElementById('quizTitle');

    questions.forEach((q, i) => {
      const div = document.createElement('div');
      div.className = 'question';
      const qTitle = document.createElement('p');
      qTitle.innerHTML = `<strong>Q${i + 1}:</strong> ${q.text}`;
      div.appendChild(qTitle);
      q.options.forEach((opt, idx) => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="radio" name="q${i}" value="${idx}" required> ${opt}`;
        div.appendChild(label);
        div.appendChild(document.createElement('br'));
      });
      container.appendChild(div);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const data = new FormData(form);
      const recommended = new Set();
      let score = 0;

      questions.forEach((q, i) => {
        const userAnswer = parseInt(data.get(`q${i}`));
        if (userAnswer === q.answer) {
          score++;
        } else {
          recommended.add(q.book);
        }
      });

      container.classList.add('hidden');
      form.querySelector('button').classList.add('hidden');
      resultDiv.classList.remove('hidden');
      recommendationsList.innerHTML = "";
      quizTitle.textContent = `Children's Character Quiz – Score: ${score}/10`;

      if (recommended.size === 0) {
        recommendationsList.innerHTML = "<li>You got everything right! No additional reading needed.</li>";
      } else {
        recommended.forEach(book => {
          const li = document.createElement('li');
          li.textContent = book;
          recommendationsList.appendChild(li);
        });
      }
    });
  </script>
</body>
</html>
