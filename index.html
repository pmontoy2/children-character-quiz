<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Children's Character Quiz</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 700px; margin: auto; }
    h1, h2 { color: #444; }
    .question { margin-bottom: 1.5rem; }
    .hidden { display: none; }
    .recommendations { margin-top: 2rem; border-top: 1px solid #ccc; padding-top: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1 id="quizTitle">Children's Character Quiz</h1>
  <form id="quizForm">
    <div id="quizContainer"></div>
    <button type="submit">Submit Answers</button>
  </form>

  <div id="result" class="hidden">
    <h2>Recommended Books</h2>
    <p id="scoreDisplay"></p>
    <ul id="recommendationsList"></ul>
  </div>

  <script>
    const questions = [
      {
        text: "Jamie notices her classmate dropped their books but looks upset. What should she do to be a good friend?",
        options: ["Ignore them and let someone else help", "Offer to help while showing kindness", "Tell them to be more careful next time", "Laugh it off to lighten the mood"],
        answer: 1,
        book: "Lumi the Light Learns About Friendship"
      },
      {
        text: "Kai is nervous before performing in the school play. What thought could help him stay hopeful?",
        options: ["If I mess up, everyone will laugh", "At least I practiced and tried my best", "I should just pretend I'm sick", "Someone else should've taken this part"],
        answer: 1,
        book: "Lumi the Light Learns to Hope"
      },
      {
        text: "What approach most consistently allows someone to express their unique strengths?",
        options: ["Outperforming everyone around you", "Hiding flaws to appear perfect", "Being brave, kind, and consistently authentic", "Focusing only on peer approval"],
        answer: 2,
        book: "Lumi the Light Learns to Shine"
      },
      {
        text: "Which statement best explains how something as simple as a pencil gets made?",
        options: ["One person builds it from scratch", "Government planners assign tasks", "It involves many people working freely together", "Factories follow one person's exact plan"],
        answer: 2,
        book: "Miraculous Pencil"
      },
      {
        text: "Jordan forgot their lines during a class skit. What would be a helpful response afterward?",
        options: ["Laugh at others next time they mess up", "Give up acting forever", "Think about what went wrong and try again next time", "Tell the teacher it wasn't their fault"],
        answer: 2,
        book: "Sometimes You Win, Sometimes You Learn"
      },
      {
        text: "What is the primary justification for having laws in a free society?",
        options: ["To ensure everyone behaves the same way", "To maintain order through control", "To protect individual rights such as life, liberty, and property", "To allow the government to give people what they need"],
        answer: 2,
        book: "The Tuttle Twins Learn About the Law"
      },
      {
        text: "Which response to sudden change shows a strong ability to adapt?",
        options: ["Stick only to what's familiar", "Get frustrated and resist", "Stay flexible and find ways to move forward", "Wait until someone else tells you what to do"],
        answer: 2,
        book: "Who Moved My Cheese for Kids"
      },
      {
        text: "Why might teachability be more beneficial long-term than raw talent?",
        options: ["Because it leads to fewer mistakes", "Because it encourages resilience, reflection, and growth", "Because talent always fades", "Because it's easier to grade"],
        answer: 1,
        book: "Sometimes You Win, Sometimes You Learn"
      },
      {
        text: "After a disagreement with her friend, Leila wants to make things better. What is the most constructive step she can take?",
        options: ["Talk behind her friend's back", "Wait and see if her friend apologizes first", "Approach her friend with honesty and forgiveness", "Tell others to choose sides"],
        answer: 2,
        book: "Lumi the Light Learns About Friendship"
      },
      {
        text: "What makes voluntary giving more meaningful than being forced to give?",
        options: ["It reflects a person's genuine care and freedom to choose", "It leads to more rewards", "It happens more often", "It proves you're better than others"],
        answer: 0,
        book: "The Tuttle Twins Learn About the Law"
      }
    ];

    const form = document.getElementById('quizForm');
    const container = document.getElementById('quizContainer');
    const resultDiv = document.getElementById('result');
    const recommendationsList = document.getElementById('recommendationsList');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const quizTitle = document.getElementById('quizTitle');

    questions.forEach((q, i) => {
      const div = document.createElement('div');
      div.className = 'question';
      const qTitle = document.createElement('p');
      qTitle.innerHTML = `<strong>Q${i + 1}:</strong> ${q.text}`;
      div.appendChild(qTitle);
      q.options.forEach((opt, idx) => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="radio" name="q${i}" value="${idx}" required> ${opt}`;
        div.appendChild(label);
        div.appendChild(document.createElement('br'));
      });
      container.appendChild(div);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const data = new FormData(form);
      const recommended = new Set();
      let score = 0;

      questions.forEach((q, i) => {
        const userAnswer = parseInt(data.get(`q${i}`));
        if (userAnswer === q.answer) {
          score++;
        } else {
          recommended.add(q.book);
        }
      });

      container.classList.add('hidden');
      form.querySelector('button').classList.add('hidden');
      resultDiv.classList.remove('hidden');
      recommendationsList.innerHTML = "";
      quizTitle.textContent = `Children's Character Quiz – Score: ${score}/10`;

      if (recommended.size === 0) {
        recommendationsList.innerHTML = "<li>You got everything right! No additional reading needed.</li>";
      } else {
        recommended.forEach(book => {
          const li = document.createElement('li');
          li.textContent = book;
          recommendationsList.appendChild(li);
        });
      }
    });
  </script>
</body>
</html>
